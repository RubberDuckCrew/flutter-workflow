name: Close Actions

on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]

jobs:
  run:
    uses: RubberDuckCrew/.github/.github/workflows/action-close-actions.yml@32641492f6cfbc78734b6adea229ec431fd51c9e # v3.1.0
    permissions:
      issues: write
      pull-requests: write
      actions: write

  cleanup:
    name: Cleanup from previous test runs
    if: ${{ github.event_name == 'pull_request' }}
    uses: $/.github/workflows/workflow-cleanup-test-release.yml
    permissions:
      contents: write
    with:
      pr-number: ${{ github.event.pull_request.number }}
      ref-name: ${{ github.event.pull_request.head.ref }}
